backend:
  name: github
  repo: mysteropodes/shapper-docs
  branch: main
  base_url: https://sveltia-cms-auth.mysteropodes-auth.workers.dev

media_folder: static/img
public_folder: /img

collections:
  - name: docs
    label: "Documentation"
    folder: docs
    create: true
    nested:
      depth: 2
    fields:
      - {label: "ID", name: "id", widget: "string", required: false}
      - {label: "Titre", name: "title", widget: "string"}
      - {label: "Contenu", name: "body", widget: "markdown"}
