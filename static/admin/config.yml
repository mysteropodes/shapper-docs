backend:
  name: github
  repo: mysteropodes/shapper-docs
  branch: main
  base_url: https://sveltia-cms-auth.mysteropodes-auth.workers.dev

media_folder: static/img
public_folder: /img

collections:

  - name: getting-started
    label: "🚀 Getting Started"
    folder: docs/getting-started
    create: true
    fields:
      - {label: "ID", name: "id", widget: "string"}
      - {label: "Titre", name: "title", widget: "string"}
      - {label: "Contenu", name: "body", widget: "markdown"}

  - name: core-concepts
    label: "💡 Core Concepts"
    folder: docs/core-concepts
    create: true
    fields:
      - {label: "ID", name: "id", widget: "string"}
      - {label: "Titre", name: "title", widget: "string"}
      - {label: "Contenu", name: "body", widget: "markdown"}

  - name: mask-influences
    label: "🎭 Mask Influences"
    folder: docs/mask-influences
    create: true
    fields:
      - {label: "ID", name: "id", widget: "string"}
      - {label: "Titre", name: "title", widget: "string"}
      - {label: "Contenu", name: "body", widget: "markdown"}

  - name: tools
    label: "🛠️ Tools"
    folder: docs/tools
    create: true
    fields:
      - {label: "ID", name: "id", widget: "string"}
      - {label: "Titre", name: "title", widget: "string"}
      - {label: "Contenu", name: "body", widget: "markdown"}

  - name: animation
