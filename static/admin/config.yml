      - {label: "ID", name: "id", widget: "string"}
      - {label: "Titre", name: "title", widget: "string"}
      - {label: "Contenu", name: "body", widget: "markdown"}

  - name: docs-root
    label: "📄 Pages standalone"
    files:
      - label: "Welcome"
        name: intro
        file: docs/intro.md
        fields:
          - {label: "Titre", name: "title", widget: "string"}
          - {label: "Contenu", name: "body", widget: "markdown"}
      - label: "Installation"
        name: installation
        file: docs/installation.md
        fields:
          - {label: "Titre", name: "title", widget: "string"}
          - {label: "Contenu", name: "body", widget: "markdown"}
      - label: "Bake"
        name: bake
        file: docs/bake.md
        fields:
          - {label: "ID", name: "id", widget: "string"}
          - {label: "Titre", name: "title", widget: "string"}
          - {label: "Contenu", name: "body", widget: "markdown"}
      - label: "Rig Optimize"
        name: rig-optimize
        file: docs/rig-optimize.md
        fields:
          - {label: "ID", name: "id", widget: "string"}
          - {label: "Titre", name: "title", widget: "string"}
          - {label: "Contenu", name: "body", widget: "markdown"}
      - label: "Shortcuts"
        name: shortcuts
        file: docs/shortcuts.md
        fields:
          - {label: "ID", name: "id", widget: "string"}
          - {label: "Titre", name: "title", widget: "string"}
          - {label: "Contenu", name: "body", widget: "markdown"}
      - label: "Feedback"
        name: feedback
        file: docs/feedback.md
        fields:
